[pytest]
testpaths = server/tests
python_files = test_*.py *_test.py
python_functions = test_*
python_classes = Test*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --durations=10
markers =
    unit: Unit tests for individual components
    integration: Integration tests for API interactions
    llm: Tests related to LLM interface
    controller: Tests for Flask controller endpoints
    service: Service layer tests
    dao: DAO layer tests
    auth: Authentication tests
    computation: Computation related tests
    data: Data processing tests
    gpt: GPT/LLM related tests
    mock: Tests using extensive mocking
    slow: Slow running tests
    external: Tests that require external services
    database: Database configuration tests
    exception: Custom exception tests
    utility: Utility/helper tests
    waiter: Waiter/polling helper tests
    wrapper: Decorator and wrapper tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::RuntimeWarning